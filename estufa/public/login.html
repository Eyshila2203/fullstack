<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-estufei</title>
    <link rel="stylesheet" href="../public/pointdocss/css_inicial/estilo.css">
</head>
<body>
    <div class="container">
        <h1>FAÇA SEU LOGIN NA ESTUFEI</h1>
        <div class="login">
            <h2>LOGIN</h2>
            <form action="/logar" method="POST">
                <div class="nome">
                    <label>Login</label>
                    <input type="text" name="nome" placeholder="Nome de usuário" required>
                </div>
                <div class="senha">
                    <label>Senha</label>
                    <input type="password" name="senha" placeholder="Sua senha" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Entrar</button>
            </form>
            <p class="text-center mt-1"> Não tem conta? <a href="/jardineironovo" class="btn2">Cadastrar</a></p>
        </div>
    </div>
</body>
</html>
