<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="public/estilo.css">
</head>
<body>
    <header>
        <h1>PORTFÓLIO</h1>
        <nav>
            <a href="/">Projetos</a>
            <a href="/login">Login</a>
            <a href="/cadastro_usuario">Cadastro</a>
        </nav>
    </header>

    <div class="container">
        <div class="card" style="margin-top: 3rem;">
            <h2>CADASTRO</h2>
            <form action="/cadastrar_usuario" method="POST">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" name="nome" placeholder="Seu nome completo" required>
                </div>
                <div class="form-group">
                    <label>Login</label>
                    <input type="text" name="login" placeholder="Nome de usuário" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" name="senha" placeholder="Sua senha" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full" style="margin-top: 1rem;">Cadastrar</button>
            </form>
            <p class="text-center mt-1">Já tem conta? <a href="/login" class="link">Entrar</a></p>
        </div>
    </div>
</body>
</html>
